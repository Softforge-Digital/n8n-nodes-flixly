# Publishes n8n-nodes-flixly to npm with provenance attestation
# whenever a v* tag is pushed. Uses npm Trusted Publishing (OIDC) —
# no NPM_TOKEN secret required.
#
# Required setup (one-time, already done):
#   1. https://www.npmjs.com/package/n8n-nodes-flixly/access →
#      "Add trusted publisher" → GitHub Actions → Softforge-Digital /
#      n8n-nodes-flixly / publish.yml / npm publish action allowed.
#
# To cut a release:
#   git tag v0.1.x -m "..." && git push origin v0.1.x
#
# The workflow runs, exchanges a short-lived OIDC token from GitHub
# for an npm publish credential, and publishes with provenance
# attestation. The published package gets a "Provenance" badge on
# npmjs.com tying the release to this exact workflow run.

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# id-token: write unlocks OIDC for npm publish — without it the
# Trusted Publisher token exchange can't happen.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: we deliberately do NOT pass `registry-url` to setup-node.
      # When that flag is set, setup-node writes ~/.npmrc with
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With no
      # token set, the env var resolves to empty string, and npm tries
      # to publish with an empty token → 404 "Not Found" before OIDC
      # even gets a chance. Skipping registry-url leaves the default
      # npm config in place, which lets npm 11's auto-OIDC detection
      # kick in via the ACTIONS_ID_TOKEN_REQUEST_URL env var.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Upgrade npm so we definitely have ≥11.5.1 (Trusted Publisher
      # OIDC fully implemented).
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance (OIDC)
        run: npm publish --provenance --access public
