# Publishes n8n-nodes-flixly to npm with provenance attestation
# whenever a v* tag is pushed. Uses npm Trusted Publishing (OIDC) —
# no NPM_TOKEN secret required.
#
# Required setup (one-time, already done):
#   1. https://www.npmjs.com/package/n8n-nodes-flixly/access →
#      "Add trusted publisher" → GitHub Actions → Softforge-Digital /
#      n8n-nodes-flixly / publish.yml / npm publish action allowed.
#
# To cut a release:
#   git tag v0.1.x -m "..." && git push origin v0.1.x

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # OIDC requires npm 11.5.1+ — Ubuntu's Node 20 ships an older bundled
      # npm. Force the latest.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Debug pre-publish state in case Trusted Publishing doesn't kick in.
      - name: Show publish environment
        run: |
          echo "── npm version ──"
          npm --version
          echo "── ~/.npmrc ──"
          cat ~/.npmrc 2>/dev/null || echo "(no user ~/.npmrc)"
          echo "── ./.npmrc ──"
          cat ./.npmrc 2>/dev/null || echo "(no project .npmrc)"
          echo "── OIDC env vars present? ──"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo "ACTIONS_ID_TOKEN_REQUEST_URL: set" || echo "ACTIONS_ID_TOKEN_REQUEST_URL: MISSING"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: set" || echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: MISSING"

      # setup-node@v4 writes its .npmrc to $NPM_CONFIG_USERCONFIG
      # (a temp path under work/_temp/), NOT to ~/.npmrc as expected.
      # That file contains `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # which resolves to an empty token at runtime and blocks OIDC
      # before it can fire. Scrub the auth/always-auth lines from
      # whichever file setup-node actually wrote to.
      - name: Strip setup-node's empty-token line from the active npmrc
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "scrubbing $NPMRC"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
            sed -i '/always-auth/d' "$NPMRC"
            echo "── $NPMRC after strip ──"
            cat "$NPMRC"
          else
            echo "($NPMRC does not exist — nothing to strip)"
          fi

      - name: Publish to npm with provenance (OIDC) — verbose
        run: npm publish --provenance --access public --loglevel verbose
        env:
          # Some npm versions require NODE_AUTH_TOKEN to be unset
          # explicitly (vs. empty string) before OIDC kicks in.
          NODE_AUTH_TOKEN: ""
