# Publishes n8n-nodes-flixly to npm with provenance attestation
# whenever a v* tag is pushed. Uses npm Trusted Publishing (OIDC) —
# no NPM_TOKEN secret required.
#
# Required setup (one-time, already done):
#   1. https://www.npmjs.com/package/n8n-nodes-flixly/access →
#      "Add trusted publisher" → GitHub Actions → Softforge-Digital /
#      n8n-nodes-flixly / publish.yml / npm publish action allowed.
#
# To cut a release:
#   git tag v0.1.x -m "..." && git push origin v0.1.x

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # OIDC requires npm 11.5.1+ — Ubuntu's Node 20 ships an older bundled
      # npm. Force the latest.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Debug pre-publish state in case Trusted Publishing doesn't kick in.
      - name: Show publish environment
        run: |
          echo "── npm version ──"
          npm --version
          echo "── ~/.npmrc ──"
          cat ~/.npmrc 2>/dev/null || echo "(no user ~/.npmrc)"
          echo "── ./.npmrc ──"
          cat ./.npmrc 2>/dev/null || echo "(no project .npmrc)"
          echo "── OIDC env vars present? ──"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo "ACTIONS_ID_TOKEN_REQUEST_URL: set" || echo "ACTIONS_ID_TOKEN_REQUEST_URL: MISSING"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: set" || echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: MISSING"

      # Explicitly clear the auth token line that setup-node writes — we
      # don't want it in the file when relying on OIDC. We keep the
      # registry URL because npm needs to know where to publish.
      - name: Strip setup-node's empty-token line from ~/.npmrc
        run: |
          if [ -f ~/.npmrc ]; then
            sed -i '/_authToken/d' ~/.npmrc
            sed -i '/always-auth/d' ~/.npmrc
            echo "── ~/.npmrc after strip ──"
            cat ~/.npmrc
          fi

      - name: Publish to npm with provenance (OIDC)
        run: npm publish --provenance --access public
